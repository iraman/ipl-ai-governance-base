name: AGL — Behavioral asset validation

on:
  pull_request:
    paths:
      - '.ai-governance/**'
      - '.cursor/rules/**'
      - 'behavior-manifest.json'
      - 'scripts/validate-governance.mjs'
      - 'scripts/governance-regression-tests.mjs'
      - 'scripts/compute-behavior-manifest.mjs'
      - 'scripts/skill-evaluator.mjs'
      - 'backend/**'
      - 'test/backend/**'
      - 'prd/**'
  push:
    branches: [main]
    paths:
      - '.ai-governance/**'
      - '.cursor/rules/**'
      - 'behavior-manifest.json'
      - 'backend/**'
      - 'test/backend/**'
      - 'prd/**'

jobs:
  governance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate governance structure
        run: npm run governance:validate

      - name: Run policy regression tests
        run: npm run governance:test

      - name: Install dependencies for the skill evaluator
        run: |
          npm ci
          npm ci --prefix backend

      - name: Evaluate skills
        run: npm run skills:eval

      - name: Upload skill evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-evaluation
          path: test-results/skill-evaluation.json

      - name: Verify manifest matches current governance files
        run: |
          npm run governance:manifest
          if ! git diff --quiet behavior-manifest.json; then
            echo "behavior-manifest.json is out of date. Run: npm run governance:manifest"
            git diff behavior-manifest.json
            exit 1
          fi
