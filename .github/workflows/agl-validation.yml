name: AGL — Behavioral asset validation

on:
  pull_request:
    paths:
      - '.ai-governance/**'
      - '.cursor/rules/**'
      - 'behavior-manifest.json'
      - 'scripts/validate-governance.mjs'
      - 'scripts/governance-regression-tests.mjs'
      - 'scripts/compute-behavior-manifest.mjs'
      - 'scripts/skill-evaluator.mjs'
      - 'scripts/prd-evaluator.mjs'
      - 'scripts/prd-grill.mjs'
      - 'scripts/lib/**'
      - 'backend/**'
      - 'frontend/src/**'
      - 'frontend/package.json'
      - 'package.json'
      - 'test/backend/**'
      - 'test/governance/**'
      - 'prd/**'
  push:
    branches: [main]
    paths:
      - '.ai-governance/**'
      - '.cursor/rules/**'
      - 'behavior-manifest.json'
      - 'backend/**'
      - 'frontend/src/**'
      - 'test/backend/**'
      - 'test/governance/**'
      - 'prd/**'

jobs:
  governance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate governance structure
        run: npm run governance:validate

      - name: Run policy regression tests
        run: npm run governance:test

      - name: Install dependencies for the skill evaluator
        run: |
          npm ci
          npm ci --prefix backend

      - name: Evaluate PRDs
        run: npm run prd:eval

      - name: Check every PRD gap has a question
        run: npm run prd:grill -- --all

      - name: Evaluate skills
        run: npm run skills:eval

      - name: Upload skill evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-evaluation
          path: |
            test-results/skill-evaluation.json
            test-results/prd-evaluation.json

      - name: Verify manifest matches current governance files
        run: npm run governance:manifest:check
